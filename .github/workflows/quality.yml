name: quality

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
      # The legacy lockfile contains expired registry.npm.taobao.org tarball URLs.
      # Resolve from the canonical registry without mutating the checked-in lockfile.
      - run: npm install --ignore-scripts --package-lock=false --legacy-peer-deps --registry=https://registry.npmjs.org
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:douban
      - run: node --check src/main/douban/runtime.js && node --check src/main/myvideo/runtime.js && node --check src/main/myvideo/runtime.worker.js
      - run: npm run build
